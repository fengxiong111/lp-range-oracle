name: Outcome Ledger Shadow Pilot CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/outcome/**'
      - 'tests/outcome-ledger.test.ts'
      - '.github/workflows/outcome-ledger-shadow-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
